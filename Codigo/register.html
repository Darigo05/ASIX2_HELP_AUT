<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Help Aut</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <!-- Logo -->
    <div class="logo text-center">
        <a href="index.html">
            <img src="./img/LogoHelpAut.png" alt="Logo Help Aut">
        </a>
    </div>

    <!-- Contenedor principal -->
    <div class="register-container">
        <h2>ÚNETE A NOSOTROS</h2>
        <form id="register-form" action="./php/registro.php" method="POST" onsubmit="return validatePasswords();">
            <div class="mb-3">
                <label for="email" class="form-label visually-hidden">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label visually-hidden">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
                <label for="apellidos" class="form-label visually-hidden">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Apellidos" required>
            </div>
            <div class="mb-3 position-relative">
                <label for="contrasena" class="form-label visually-hidden">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Contraseña" required>
                <i class="fas fa-eye toggle-password" id="toggle-contrasena" onclick="togglePassword('contrasena')"></i>
            </div>
            <div class="mb-3 position-relative">
                <label for="cpassword" class="form-label visually-hidden">Confirmar Contraseña</label>
                <input type="password" class="form-control" id="cpassword" name="cpassword" placeholder="Repetir contraseña" required>
                <i class="fas fa-eye toggle-password" id="toggle-cpassword" onclick="togglePassword('cpassword')"></i>
            </div>
            <div class="mb-3">
                <label for="account-type" class="form-label visually-hidden">Tipo de cuenta</label>
                <select class="form-control custom-select" id="account-type" name="account_type" required>
                    <option value="">Selecciona un tipo de cuenta</option>
                    <option value="psicologo">Crear cuenta como psicólogo</option>
                    <option value="paciente">Crear cuenta como paciente</option>
                    <option value="padre_hijo">Crear cuenta como padre/hijo</option>
                </select>
            </div>
            <button type="submit" name="submit" class="btn btn-custom w-100">Crear cuenta</button>
            <p class="text-center mt-3">¿Ya tienes cuenta? <a href="./login.html" class="login-link">Inicia sesión aquí</a></p>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <!-- JS personalizado -->
    <script src="./js/script.js"></script>
</body>
</html>
