<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Help Aut</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <!-- Logo -->
    <div class="logo text-center">
        <a href="index.html">
            <img src="./img/LogoHelpAut.png" alt="Logo Help Aut">
        </a>
    </div>

    <!-- Contenedor principal -->
    <div class="login-container">
        <h2>INICIAR SESIÓN</h2>

        <!-- El action apunta al archivo PHP de autenticación -->
        <form id="login-form" method="POST" action="./php/acceso.php">
            <div class="mb-3">
                <label for="email" class="form-label visually-hidden">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="mb-3 position-relative">
                <label for="contrasena" class="form-label visually-hidden">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Contraseña" required>
                <i class="fas fa-eye toggle-password" id="toggle-password" onclick="togglePassword('contrasena')"></i>
            </div>
            <button type="submit" name="submit" class="btn btn-custom w-100">Iniciar sesión</button>

            <!-- Sección para mostrar errores usando JavaScript -->
            <div id="error-message" class="alert alert-danger mt-3" style="display: none;" role="alert"></div>

            <p class="text-center mt-3">
                ¿No tienes cuenta? <a href="./register.html" class="register-link">Regístrate aquí</a>
            </p>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <!-- JS personalizado -->
    <script src="./js/script.js"></script>

    <script>
        // Verificar si hay un error en la URL (parámetro 'error')
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('error');

        // Si hay un mensaje de error, lo mostramos
        if (errorMessage) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = errorMessage;
            errorElement.style.display = 'block';
        }

        
    </script>

</body>
</html>
