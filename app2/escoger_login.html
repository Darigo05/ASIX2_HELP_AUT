<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escoger Inicio de Sesión - Help Aut</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <!-- Logo -->
    <div class="logo text-center">
        <a href="index.html">
            <img src="./img/LogoHelpAut.png" alt="Logo Help Aut">
        </a>
    </div>

    <!-- Contenedor principal -->
    <div class="login-container">
        <h2>INICIAR SESIÓN</h2>

        <!-- Botón Paciente -->
        <button onclick="location.href='./login.html'" class="btn btn-custom w-100">
            Iniciar sesión como Paciente
        </button>

        <!-- Espacio entre botones -->
        <div class="mt-3"></div>

        <!-- Botón Psicólogo -->
        <button onclick="location.href='login_psicologos.html'" class="btn btn-psico w-100">
            Iniciar sesión como Psicólogo
        </button>

        <hr class="my-4">

        <!-- Botón Administrador -->
        <button onclick="location.href='login_admin.html'" class="btn btn-custom btn-admin w-100">
            Iniciar sesión como Administrador
        </button>

        <hr class="my-4">

        <p class="text-center mt-3">
            ¿No tienes cuenta? <a href="./escoger_registro.html" class="register-link">Regístrate aquí</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <!-- JS personalizado -->
    <script src="./js/script.js"></script>

    <script>
        // Verificar si hay un error en la URL (parámetro 'error')
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('error');

        // Si hay un mensaje de error, lo mostramos
        if (errorMessage) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = errorMessage;
            errorElement.style.display = 'block';
        }
    </script>
</body>
</html>
