<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktPZ6YUiHGccPkk2lt1EMV0p2K7Zj6f2Cg8ifwBhe" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="./css/formulario.css" rel="stylesheet">
</head>

<body>

  <!-- Flecha Atrás -->
<div class="back-button-container">
    <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Atrás
    </a>
</div>


<div class="container mt-4">
    <form>
        <!-- Título principal: Perfil Pacientes -->
        <div class="row mb-5">
            <div class="col">
                <h4 class="text-warning">Perfil Pacientes</h4>
            </div>
        </div>

        <!-- Título 1: Tipo de plan -->
        <div class="row mb-5">
            <div class="col d-flex align-items-center">
                <label for="planType" class="form-label mb-0 me-3"><strong>Tipo de plan:</strong></label>
                <select id="planType" class="form-select" style="width: auto;" onchange="toggleTherapyFor()">
                    <option value="">Selecciona un plan</option>
                    <option value="basic">Plan Básico</option>
                    <option value="premium">Plan Premium</option>
                </select>
            </div>
        </div>

        <!-- ¿Para quién es la terapia? (Solo visible si el plan es Premium) -->
        <div class="row mb-5" id="therapyForSection" style="display: none;">
            <div class="col">
                <label class="form-label">¿Para quién es la terapia?</label>
                <div class="single-checkbox">
                    <input type="checkbox" id="forParent" name="therapyFor" value="parent" onclick="onlyOne(this)">
                    <label for="forParent">Para Mí (Persona con Autismo)</label>
                </div>
                <div class="single-checkbox">
                    <input type="checkbox" id="forChild" name="therapyFor" value="child" onclick="onlyOne(this)">
                    <label for="forChild">Para padres/madres</label>
                </div>
                <div class="single-checkbox">
                    <input type="checkbox" id="forChild" name="therapyFor" value="child" onclick="onlyOne(this)">
                    <label for="forChild">Para mi Hijo/a</label>
                </div>
                <div class="single-checkbox">
                    <input type="checkbox" id="forBoth" name="therapyFor" value="both" onclick="onlyOne(this)">
                    <label for="forBoth">Para padres/madres y para hijos</label>
                </div>
            </div>
        </div>

        <!-- Campo de fecha de nacimiento -->
        <div class="row mb-4">
            <div class="col">
                <label for="parentBirthDate" class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="parentBirthDate">
            </div>
        </div>

        <!-- Campo Sexo -->
        <div class="input-group mb-4">
            <label for="sexo" class="form-label">Sexo</label>
            <select id="sexo" name="sexo" class="form-select" required>
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="masculino">Masculino</option>
              <option value="femenino">Femenino</option>
              <option value="no-binario">No binario</option>
              <option value="sin-especificar">Sin especificar</option>
            </select>
          </div>

        <!-- Sección: ¿Dónde vives? -->
    
        <div class="input-group mb-4">
            <label class="form-label">¿Dónde vives?</label>
            <input type="text" name="provincia" placeholder="País" required />
            <input type="text" name="municipio" placeholder="Municipio" required />
            <input type="text" name="ciudad" placeholder="Provincia" required />
            <input type="text" name="pais" placeholder="Ciudad" required />
          </div>
       

        <!-- Sección: Aspectro autista -->
        <div class="row mb-5">
            <div class="col">
                <label class="form-label">Aspectro autista</label>
                <div class="single-checkbox">
                    <input type="checkbox" id="grade1" name="autismGrade" value="grade1" onclick="onlyOne(this)">
                    <label for="grade1">Grado 1: Necesita ayuda</label>
                </div>
                <div class="single-checkbox">
                    <input type="checkbox" id="grade2" name="autismGrade" value="grade2" onclick="onlyOne(this)">
                    <label for="grade2">Grado 2: Necesita ayuda notable</label>
                </div>
                <div class="single-checkbox">
                    <input type="checkbox" id="grade3" name="autismGrade" value="grade3" onclick="onlyOne(this)">
                    <label for="grade3">Grado 3: Necesita ayuda muy notable</label>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <label for="interests" class="form-label">Intereses y actividades</label>
                <textarea id="interests" class="form-control" rows="5" placeholder="Describe los intereses y actividades del hijo"></textarea>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <label for="socialInteraction" class="form-label">Interacción social y comunicación</label>
                <textarea id="socialInteraction" class="form-control" rows="5" placeholder="Describe la interacción social y comunicación del hijo"></textarea>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col">
                <label class="form-label">¿Has recibido algún tipo de terapia o apoyo antes?</label>
                <div>
                    <input type="radio" id="noTherapy" name="receivedTherapy" value="no" onclick="toggleTherapyDetails(false)">
                    <label for="noTherapy">No</label>
                </div>
                <div>
                    <input type="radio" id="yesTherapy" name="receivedTherapy" value="yes" onclick="toggleTherapyDetails(true)">
                    <label for="yesTherapy">Sí</label>
                </div>
                <div id="therapyDetails" style="display: none;">
                    <label for="therapyDescription" class="form-label mt-3">Describe brevemente cómo fue su terapia</label>
                    <textarea id="therapyDescription" class="form-control" rows="3"></textarea>
                </div>
            </div>
        </div>

        <!-- Nueva pregunta: ¿Quieres terapia para tu hijo? -->
        <div class="row mb-4">
            <div class="col">
                <label class="form-label">¿Quieres terapia para tu hijo?</label>
                <div>
                    <input type="radio" id="yesChildTherapy" name="childTherapy" value="yes" onclick="toggleChildTherapyFields(true)">
                    <label for="yesChildTherapy">Sí</label>
                </div>
                <div>
                    <input type="radio" id="noChildTherapy" name="childTherapy" value="no" onclick="toggleChildTherapyFields(false)">
                    <label for="noChildTherapy">No</label>
                </div>
            </div>
        </div>

        <!-- Campos de nombre y fecha de nacimiento del hijo (ocultos inicialmente) -->
        <div id="childTherapyFields" style="display: none;">
            <div class="row mb-4">
                <div class="col">
                    <label for="childName" class="form-label">Nombre de tu hijo</label>
                    <input type="text" class="form-control" id="childName" placeholder="Nombre completo">
                </div>
            </div>
            <div class="row mb-4">
                <div class="col">
                    <label for="childBirthDate" class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="childBirthDate">
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <label for="documents" class="form-label">Colgar documentación</label>
                <input type="file" id="documents" class="form-control">
            </div>
        </div>

        <!-- Nueva sección de Payment Details -->
        <div class="row mb-5">
            <div class="col">
                <h4 class="text-warning">Detalles de Pago</h4>
                <div class="input-group mb-3">
                    <input id="payment-method-card" type="radio" name="payment-method" value="card" checked="true">
                    <label for="payment-method-card">
                        <span>
                            <i class="fa fa-cc-visa"></i> Tarjeta de Crédito
                        </span>
                    </label>
                    <input id="payment-method-paypal" type="radio" name="payment-method" value="paypal">
                    <label for="payment-method-paypal">
                        <span>
                            <a href="https://www.paypal.com/signin" target="_blank">
                                <span>
                                    <i class="fa fa-cc-paypal"></i> Paypal
                                </span>
                            </a>
                            
                        </span>
                    </label>
                </div>
                <div class="input-group input-group-icon">
                    <input type="text" placeholder="Número de tarjeta">
                    <div class="input-icon">
                        <i class="fa fa-credit-card"></i>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group input-group-icon">
                            <input type="text" placeholder="CVC de tarjeta">
                            <div class="input-icon">
                                <i class="fa fa-user"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <select>
                                <option>Mes de expiración</option>
                                <option>Enero</option>
                                <option>Febrero</option>
                                <option>Marzo</option>
                                <option>Abril</option>
                                <option>Mayo</option>
                                <option>Junio</option>
                                <option>Julio</option>
                                <option>Agosto</option>
                                <option>Setiembre</option>
                                <option>Octubre</option>
                                <option>Noviembre</option>
                                <option>Diciembre</option>
                            </select>
                            <select>
                                <option>Año de expiración</option>
                                <option>2025</option>
                                <option>2026</option>
                                <option>2027</option>
                                <option>2028</option>
                                <option>2029</option>
                                <option>2030</option>
                                <option>2031</option>
                                <option>2032</option>
                                <option>2033</option>
                                <option>2034</option>
                                <option>2035</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botón de envío del formulario -->
        <div class="row mb-5">
            <div class="col text-end"> <!-- Se añadió text-end para alinear a la derecha -->
                <a href="register.html" class="btn btn-warning w-100 btn-enviar">Enviar</a>
            </div>
    </form>
</div>


<!-- Botón que redirige a otra página -->
<div class="change-account-container">
    <a href="formulario_psicologos.html" class="btn btn-change-account w-100">
        Cambiar a cuenta Psicólogos
    </a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
<!-- JS personalizado -->
<script src="./js/formulario.js"></script> <!-- Aquí vinculas tu archivo JS -->
</body>
</html>
