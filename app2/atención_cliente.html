<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesos a Jira y Gmail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 80%;
            max-width: 500px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            transition: color 0.3s;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            width: 200px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .jira-btn {
            background-color: #0052CC;
            color: white;
        }

        .gmail-btn {
            background-color: #DB4437;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px);
        }

        .mode-toggle {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .mode-toggle:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Accede a Jira o Gmail</h1>
        <a href="https://helpaut.atlassian.net/jira/servicedesk/projects/AAC/queues/custom/5" class="btn jira-btn" target="_blank">
            Ir a Jira
        </a>
        <a href="https://mail.google.com/mail/u/0/#inbox" class="btn gmail-btn" target="_blank">
            Ir a Gmail
        </a>
    </div>

</body>
</html>
